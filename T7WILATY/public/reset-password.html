<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة مرور جديدة | Store-Card</title>
    <link rel="stylesheet" href="css/login.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo-link">
                <div class="logo">Store<span>Card</span></div>
            </a>
            <h2>تعيين كلمة مرور جديدة</h2>
            <p>أدخل كلمة المرور الجديدة</p>

            <form id="reset-form">
                <div class="input-group">
                    <label>كلمة المرور الجديدة</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="new-pass" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
                        <i class="fas fa-eye toggle-pass" id="toggle-new" style="right:auto;left:12px;cursor:pointer;"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label>تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-pass" placeholder="أعد إدخال كلمة المرور" required minlength="6">
                        <i class="fas fa-eye toggle-pass" id="toggle-confirm" style="right:auto;left:12px;cursor:pointer;"></i>
                    </div>
                </div>
                <div id="pass-error" style="display:none; color:#ef4444; font-size:13px; margin-bottom:12px; text-align:right;">
                    كلمتا المرور غير متطابقتين
                </div>
                <button type="submit" id="reset-btn">حفظ كلمة المرور</button>
            </form>

            <!-- حالة: تم التغيير -->
            <div id="reset-success" style="display:none; text-align:center; padding: 10px 0;">
                <div style="font-size: 48px; margin-bottom: 16px;">✅</div>
                <h3 style="color: #22c55e; margin-bottom: 8px;">تم التغيير بنجاح!</h3>
                <p style="color: #94a3b8; font-size: 14px;">سيتم تحويلك لتسجيل الدخول...</p>
            </div>
        </div>
    </div>
    <script type="module" src="js/reset-password.js?v=1"></script>
</body>
</html>
