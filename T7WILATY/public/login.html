<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Store-Card</title>
    <link rel="stylesheet" href="css/login.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo-link">
                <div class="logo">Store<span>Card</span></div>
            </a>
            <h2>مرحباً بك مجدداً</h2>
            <p>سجل دخولك لإدارة محفظتك وطلباتك</p>

            <!-- تبديل طريقة الدخول -->
            <div class="login-tabs">
                <button class="tab-btn active" id="tab-email" onclick="switchTab('email')">
                    <i class="fas fa-envelope"></i> البريد الإلكتروني
                </button>
                <button class="tab-btn" id="tab-phone" onclick="switchTab('phone')">
                    <i class="fas fa-phone"></i> رقم الهاتف
                </button>
            </div>

            <form id="login-form">
                <!-- حقل البريد الإلكتروني -->
                <div class="input-group" id="field-email">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="example@gmail.com">
                    </div>
                </div>

                <!-- حقل رقم الهاتف -->
                <div class="input-group" id="field-phone" style="display:none;">
                    <label>رقم الهاتف</label>
                    <div class="input-wrapper phone-wrapper">
                        <span class="phone-prefix">+222</span>
                        <input type="tel" id="reg-phone"
                               placeholder="xxxxxxxx"
                               maxlength="8"
                               pattern="[0-9]{8}">
                        <i class="fas fa-phone phone-icon"></i>
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <div class="label-row">
                        <label>كلمة المرور</label>
                        <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="user-pass" placeholder="أدخل كلمة المرور" required>
                        <i class="fas fa-eye toggle-pass" id="toggle-pass"></i>
                    </div>
                </div>

                <button type="submit" id="login-btn">دخول آمن</button>
            </form>

            <div class="login-footer">
                ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/login.js?v=4"></script>
</body>
</html>
