<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفعيل الحسابات | StoreCard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
    :root {
        --bg:      #0a0f1a;
        --surface: #0f172a;
        --card:    #1e293b;
        --border:  #334155;
        --text:    #e2e8f0;
        --muted:   #94a3b8;
        --accent:  #f97316;
        --green:   #22c55e;
        --red:     #ef4444;
        --blue:    #3b82f6;
        --yellow:  #fcd535;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Tajawal', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 24px;
    }
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .header h1 {
        font-size: 22px;
        font-weight: 800;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }
    .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: 900; margin-bottom: 4px; }
    .stat-card .lbl { font-size: 12px; color: var(--muted); }
    .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        align-items: center;
    }
    .toolbar input {
        flex: 1;
        min-width: 200px;
        padding: 10px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: 'Tajawal', sans-serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }
    .toolbar input:focus { border-color: var(--accent); }
    .toolbar input::placeholder { color: var(--muted); }
    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: 'Tajawal', sans-serif;
        font-size: 13px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: opacity 0.2s, transform 0.15s;
        white-space: nowrap;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-green   { background: var(--green);  color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }
    .tab {
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-family: 'Tajawal', sans-serif;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s;
    }
    .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: var(--card); border-bottom: 1px solid var(--border); }
    th {
        padding: 12px 16px;
        text-align: right;
        font-weight: 700;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
    }
    td {
        padding: 12px 16px;
        border-bottom: 1px solid rgba(51,65,85,0.5);
        vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(249,115,22,0.03); }
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
    }
    .badge-active   { background: rgba(34,197,94,0.12);  color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .badge-inactive { background: rgba(239,68,68,0.12);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .badge-blocked  { background: rgba(245,158,11,0.12); color: #f59e0b;      border: 1px solid rgba(245,158,11,0.3); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm {
        padding: 5px 12px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-family: 'Tajawal', sans-serif;
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: opacity 0.2s;
        white-space: nowrap;
    }
    .btn-sm:hover { opacity: 0.82; }
    .empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; }
    #toast {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        z-index: 99999;
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        white-space: nowrap;
        font-family: 'Tajawal', sans-serif;
    }
    #toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--green); color: white; }
    #toast.error   { background: var(--red);   color: white; }
    #toast.info    { background: var(--blue);  color: white; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
    }
</style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-user-check"></i> تفعيل الحسابات يدوياً</h1>
    <div style="display:flex;gap:8px;">
        <button class="btn btn-outline" onclick="loadUsers()">
            <i class="fas fa-sync-alt"></i> تحديث
        </button>
        <button class="btn btn-green" onclick="activateAll()">
            <i class="fas fa-check-double"></i> تفعيل الكل
        </button>
    </div>
</div>

<div class="stats">
    <div class="stat-card">
        <div class="num" id="stat-total" style="color:var(--blue);">—</div>
        <div class="lbl">إجمالي الحسابات</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-active" style="color:var(--green);">—</div>
        <div class="lbl">✅ مفعّل</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-inactive" style="color:var(--red);">—</div>
        <div class="lbl">❌ غير مفعّل</div>
    </div>
    <div class="stat-card">
        <div class="num" id="stat-blocked" style="color:#f59e0b;">—</div>
        <div class="lbl">🚫 محظور</div>
    </div>
</div>

<div class="toolbar">
    <input type="text" id="search-input"
        placeholder="🔍 ابحث برقم الهاتف أو الاسم..."
        oninput="filterTable()">
</div>

<div class="tabs">
    <button class="tab active" onclick="setFilter('all', this)">الكل</button>
    <button class="tab" onclick="setFilter('inactive', this)">❌ غير مفعّل</button>
    <button class="tab" onclick="setFilter('active', this)">✅ مفعّل</button>
    <button class="tab" onclick="setFilter('blocked', this)">🚫 محظور</button>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>رقم الهاتف</th>
                <th>البريد الإلكتروني</th>
                <th>تاريخ التسجيل</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="users-table">
            <tr><td colspan="7" class="empty"><span class="spinner"></span> جاري التحميل...</td></tr>
        </tbody>
    </table>
</div>

<div id="toast"></div>

<script type="module" src="./js/activate-users.js"></script>
</body>
</html>
