<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.anthropic.com https://cdn.jsdelivr.net; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self';">
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store-Card</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/index.css?v=2">
    <link rel="stylesheet" href="css/chat-float.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css?v=2">
    <link rel="icon" type="image/png" href="assets/Icon.png">
    <link rel="preconnect" href="https://btcmfdfepykwimukbiad.supabase.co">
    <link rel="dns-prefetch" href="https://btcmfdfepykwimukbiad.supabase.co">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
</head>

<body>
    <header class="main-header">
        <div class="header-container">
            <a href="index.html" class="logo-link" style="text-decoration:none;">
                <div class="logo" style="display:flex; align-items:center; gap:10px;">
                    <img src="assets/Icon.png" alt="Store-Card" style="height:40px; width:40px; object-fit:contain;">
                    <div style="display:flex; flex-direction:column; line-height:1.1;">
                        <span style="font-size:18px; font-weight:800; color:var(--text-primary, #1e293b);">Store<span
                                style="color:#f97316;">Card</span></span>
                    </div>
                </div>
            </a>

            <div class="search-container">
                <div class="search-bar">
                    <input type="text" id="main-search" placeholder="ابحث عن بطاقة...">
                    <button><i class="fas fa-search"></i></button>
                </div>
            </div>

            <div class="header-actions">
                <button id="theme-toggle" class="action-btn"><i class="fas fa-moon"></i></button>
                <a href="cart.html" class="action-btn"><i class="fas fa-shopping-cart"></i></a>

                <div class="user-menu-container">
                    <button class="action-btn" id="user-icon-btn">
                        <i class="fas fa-user-circle"></i>
                    </button>
                    <div class="dropdown-menu" id="user-dropdown">
                        <nav class="dropdown-nav">
                            <a href="orders.html"><i class="fas fa-box"></i> طلباتي</a>
                            <a href="wallet.html"><i class="fas fa-wallet"></i> المحفظة</a>
                            <a href="profile.html"><i class="fas fa-user"></i> حسابي</a>
                            <hr>
                            <button onclick="handleLogout()" class="logout-btn">
                                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                            </button>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="checkout-container">
        <div class="checkout-card">

            <!-- ── العنوان ── -->
            <div class="checkout-title">
                <i class="fas fa-shield-alt" style="color:#f97316;"></i>
                مراجعة الدفع
            </div>

            <!-- ── ملخص الطلب ── -->
            <div class="order-summary">
                <div class="summary-line">
                    <span>إجمالي المشتريات</span>
                    <span class="summary-val" id="checkout-total">0 MRU</span>
                </div>
            </div>

            <!-- ── رصيد المحفظة ── -->
            <div class="wallet-balance-line">
                <span style="display:flex;align-items:center;gap:6px;">
                    <i class="fas fa-wallet"></i>
                    رصيد محفظتك الحالي
                </span>
                <span id="current-wallet-balance" style="font-weight:800;">0 MRU</span>
            </div>

            <!-- ── طرق الدفع ── -->
            <div style="margin-bottom:20px;">
                <div style="font-size:14px;font-weight:700;color:#94a3b8;
                            margin-bottom:12px;display:flex;align-items:center;gap:7px;">
                    <i class="fas fa-credit-card" style="color:#f97316;"></i>
                    اختر طريقة الدفع
                </div>
                <div id="payment-methods-list">
                    <div style="text-align:center;color:#475569;padding:20px;font-size:13px;">
                        <i class="fas fa-spinner fa-spin"></i> جاري تحميل طرق الدفع...
                    </div>
                </div>
            </div>

            <!-- ── معلومات الطريقة المختارة ── -->
            <div id="selected-method-info" style="display:none; margin-bottom:16px;
                 background:rgba(249,115,22,0.06); border:1px solid rgba(249,115,22,0.2);
                 border-radius:12px; padding:14px 16px;">
                <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;">
                    <i class="fas fa-hashtag" style="color:#f97316;"></i> رقم الحساب
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                    <span id="selected-account" style="font-size:17px;font-weight:800;color:#f97316;
                                 font-family:monospace;letter-spacing:1px;"></span>
                    <button onclick="copyAccount()" style="background:#1e293b;color:#94a3b8;border:1px solid #334155;
                               padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;
                               display:flex;align-items:center;gap:5px;transition:all 0.2s;"
                        onmouseover="this.style.color='#f97316';this.style.borderColor='#f97316'"
                        onmouseout="this.style.color='#94a3b8';this.style.borderColor='#334155'">
                        <i class="fas fa-copy"></i> نسخ
                    </button>
                </div>
            </div>

            <!-- ── رفع الإيصال ── -->
            <div id="receipt-upload-section" style="display:none; margin-bottom:16px;">
                <div style="font-size:13px;font-weight:700;color:#94a3b8;
                            margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                    <i class="fas fa-receipt" style="color:#f97316;"></i>
                    ارفع إيصال الدفع
                </div>
                <input type="file" id="receipt-input" accept="image/*" style="display:none">
                <div onclick="document.getElementById('receipt-input').click()" style="border:2px dashed rgba(249,115,22,0.35);border-radius:12px;
                            padding:22px;text-align:center;cursor:pointer;
                            background:rgba(249,115,22,0.03);transition:all 0.2s;"
                    onmouseover="this.style.borderColor='#f97316';this.style.background='rgba(249,115,22,0.07)'"
                    onmouseout="this.style.borderColor='rgba(249,115,22,0.35)';this.style.background='rgba(249,115,22,0.03)'">
                    <i class="fas fa-cloud-upload-alt"
                        style="font-size:26px;color:#f97316;margin-bottom:8px;display:block;"></i>
                    <span style="font-size:13px;color:#64748b;">اضغط لرفع صورة الإيصال</span>
                </div>
                <img id="receipt-preview" src="" style="display:none;width:100%;border-radius:10px;margin-top:10px;
                            border:1px solid rgba(255,255,255,0.06);">
            </div>

            <!-- ── رسائل الحالة ── -->
            <div id="payment-status-msg"></div>

            <!-- ── زر الدفع ── -->
            <button id="confirm-payment-btn" class="pay-now-btn" disabled>
                <i class="fas fa-bolt"></i>
                تأكيد الدفع الآن
            </button>

            <!-- ── ملاحظة الأمان ── -->
            <p class="security-note">
                <i class="fas fa-lock" style="color:#22c55e;"></i>
                سيتم خصم المبلغ من محفظتك فوراً وتصلك أكواد البطاقات في "طلباتي"
            </p>

        </div>
    </main>
    <!-- زر الدردشة العائم -->
    <div id="chat-float-btn" onclick="toggleChatWidget()" title="تواصل مع الدعم الفني">
        <i class="fas fa-headset"></i>
        <span class="chat-float-badge" id="chat-float-badge"></span>
    </div>
    <script type="module" src="js/public-header.js?v=2"></script>
    <script type="module" src="js/checkout.js?v=2"></script>
    <script type="module" src="js/chat-float.js?v=2"></script>
</body>

</html>
