<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | Store-Card</title>
    <link rel="stylesheet" href="css/login.css?v=4">
    <link rel="stylesheet" href="css/register.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo-link">
                <div class="logo">Store<span>Card</span></div>
            </a>
            <h2>انضم إلينا</h2>
            <p>أنشئ حسابك وابدأ بشحن بطاقاتك المفضلة</p>

            <!-- ✅ زر Google -->
            <button id="google-btn" onclick="signInWithGoogle()" style="
                width:100%; padding:12px; margin-bottom:16px;
                background:white; color:#1f2937;
                border:1.5px solid #e2e8f0; border-radius:10px;
                font-size:15px; font-weight:700; cursor:pointer;
                display:flex; align-items:center; justify-content:center; gap:10px;
                font-family:'Tajawal',sans-serif; transition:box-shadow 0.2s;">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                التسجيل بـ Google
            </button>

            <!-- فاصل -->
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
                <div style="flex:1;height:1px;background:#334155;"></div>
                <span style="color:#64748b;font-size:13px;">أو سجل بالبريد الإلكتروني</span>
                <div style="flex:1;height:1px;background:#334155;"></div>
            </div>

            <form id="register-form">
                <!-- الاسم الكامل -->
                <div class="input-group">
                    <label>الاسم الكامل</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" placeholder="أدخل اسمك الكامل" required>
                    </div>
                </div>

                <!-- رقم الهاتف -->
                <div class="input-group">
                    <label>رقم الهاتف</label>
                    <div class="input-wrapper phone-wrapper">
                        <span class="phone-prefix">+222</span>
                        <input type="tel" id="reg-phone"
                               placeholder="xxxxxxxx"
                               maxlength="8"
                               pattern="[0-9]{8}"
                               required>
                        <i class="fas fa-phone phone-icon"></i>
                    </div>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="example@gmail.com" required>
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-pass"
                               placeholder="كلمة مرور قوية (6 أحرف على الأقل)" required>
                        <i class="fas fa-eye toggle-pass" id="toggle-reg-pass"></i>
                    </div>
                </div>

                <button type="submit" id="register-btn">إنشاء الحساب</button>
            </form>

            <div class="login-footer">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/register.js?v=5"></script>
</body>
</html>
