<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور | Store-Card</title>
    <link rel="stylesheet" href="css/login.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo-link">
                <div class="logo">Store<span>Card</span></div>
            </a>
            <h2>نسيت كلمة المرور؟</h2>
            <p>أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين</p>

            <!-- حالة: الفورم -->
            <form id="forgot-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="forgot-email" placeholder="example@gmail.com" required>
                    </div>
                </div>
                <button type="submit" id="forgot-btn">إرسال رابط الاستعادة</button>
            </form>

            <!-- حالة: تم الإرسال -->
            <div id="success-msg" style="display:none; text-align:center; padding: 10px 0;">
                <div style="font-size: 48px; margin-bottom: 16px;">📧</div>
                <h3 style="color: #22c55e; margin-bottom: 8px;">تم الإرسال!</h3>
                <p style="color: #94a3b8; font-size: 14px; line-height: 1.6;">
                    تحقق من بريدك الإلكتروني واضغط على الرابط لإعادة تعيين كلمة المرور.
                    <br>قد يصل في مجلد الـ Spam.
                </p>
            </div>

            <div class="login-footer">
                <a href="login.html"><i class="fas fa-arrow-right" style="font-size:11px;"></i> العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/forgot-password.js?v=1"></script>
</body>
</html>
