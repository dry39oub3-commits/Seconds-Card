        /* ============================================
   StoreCard — Product Details
   Theme: Silver + Dark
============================================ */

/* ─── متغيرات البطاقة ─── */
:root {
    --card-bg:      #ffffff;
    --card-border:  rgba(30,36,51,0.09);
    --label-color:  #8892a4;
    --input-bg:     #ffffff;
    --input-border: #dde0e8;
    --text-primary: #1e2433;
    --text-secondary: #8892a4;
}

[data-theme="dark"] {
    --card-bg:      #1e2433;
    --card-border:  rgba(255,255,255,0.07);
    --label-color:  #94a3b8;
    --input-bg:     #252d3d;
    --input-border: #334155;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
}

.product-page {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    color: var(--text-primary);
}

/* ── بطاقة المنتج الرئيسية ── */
.product-header {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 28px;
    border: 1.5px solid var(--card-border);
    box-shadow: 0 2px 16px rgba(30,36,51,0.07);
}

.product-header img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 14px;
    background: #f6f7f9;
    box-shadow: 0 4px 16px rgba(30,36,51,0.1);
    flex-shrink: 0;
}

.product-header h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-primary);
    line-height: 1.3;
}

.product-header .country {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
}

/* ── شارة المخزون ── */
.stock-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(22,163,74,0.08);
    color: #16a34a;
    border: 1px solid rgba(22,163,74,0.2);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}
.stock-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #16a34a;
    animation: blink 2s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
}

/* ── عنوان القسم ── */
.prices-title {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-bottom: 14px;
}

/* ── شبكة الأسعار ── */
.prices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
}

.price-card {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 14px;
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(30,36,51,0.06);
}
.price-card:hover {
    border-color: rgba(30,36,51,0.3);
    background: rgba(30,36,51,0.03);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30,36,51,0.1);
}
.price-card.selected {
    border: 2px solid #1e2433;
    background: rgba(30,36,51,0.05);
    box-shadow: 0 6px 20px rgba(30,36,51,0.12);
}

/* علامة ✓ */
.price-card.selected::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 28px 28px 0;
    border-color: transparent #1e2433 transparent transparent;
}
.price-card.selected::after {
    content: '✓';
    position: absolute;
    top: 2px; right: 2px;
    font-size: 9px;
    color: white;
    font-weight: 800;
    line-height: 1;
}

.price-card .label { color: var(--label-color); }
.price-card .value {
    font-size: 24px;
    font-weight: 700;
    color: #1e2433;
    line-height: 1;
    margin-bottom: 4px;
}
[data-theme="dark"] .price-card .value { color: #e2e8f0; }

.price-card .currency {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
}

/* ── أزرار الإجراء ── */
.action-buttons { display: flex; gap: 12px; }

.add-to-cart-btn {
    flex: 1;
    padding: 15px;
    background: #eceef2;
    border: 1.5px solid #dde0e8;
    border-radius: 14px;
    color: #1e2433;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
}
.add-to-cart-btn:hover:not(:disabled) {
    background: #dde0e8;
    border-color: #c8ccd6;
}
[data-theme="dark"] .add-to-cart-btn {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.1);
    color: #e2e8f0;
}
[data-theme="dark"] .add-to-cart-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
}

.buy-now-btn {
    flex: 1;
    padding: 15px;
    background: #1e2433;
    border: none;
    border-radius: 14px;
    color: #f6f7f9;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    box-shadow: 0 4px 20px rgba(30,36,51,0.2);
}
.buy-now-btn:hover:not(:disabled) {
    opacity: 0.88;
    transform: translateY(-1px);
    box-shadow: 0 6px 26px rgba(30,36,51,0.3);
}

.add-to-cart-btn:disabled,
.buy-now-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
}

/* ── خطوات الاستخدام ── */
.steps-box {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 24px;
    box-shadow: 0 1px 4px rgba(30,36,51,0.05);
}
.steps-title {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 14px;
}

.step-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(30,36,51,0.06);
    color: #1e2433;
    border: 1px solid rgba(30,36,51,0.2);
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    margin: 0 4px;
    transition: background 0.2s;
}
.step-link:hover { background: rgba(30,36,51,0.12); }

[data-theme="dark"] .step-link {
    background: rgba(226,232,240,0.08);
    color: #e2e8f0;
    border-color: rgba(226,232,240,0.2);
}

/* ── وصف المنتج ── */
#product-description-box {
    background: var(--card-bg);
    border: 1.5px solid var(--card-border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 24px;
    color: var(--text-primary);
    box-shadow: 0 1px 4px rgba(30,36,51,0.05);
}

/* ── موبايل ── */
@media (max-width: 600px) {
    .product-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 18px;
    }
    .product-header img { width: 80px; height: 80px; }
    .product-header h1 { font-size: 18px; }
    .prices-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    .price-card { padding: 16px 12px; }
    .price-card .value { font-size: 20px; }
    .action-buttons { flex-direction: column; }
    .add-to-cart-btn, .buy-now-btn { padding: 14px; }
}
    </style>
</head>
